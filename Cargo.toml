[workspace]
members = [
    "client",
    "client_native",
    "client_web",
    "logic",
    "nanotime",
    "server",
    "tests",
]
resolver = "2"

[workspace.dependencies]
hecs = "0.11.1"
nanoserde = "0.1.37"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3.34"
wgpu = { version = "23.0.0", features = ["webgl"] }
web-sys = { version = "0.3.76", features = ["KeyboardEvent", "HtmlCanvasElement", "console", "Performance", "Window"] }
